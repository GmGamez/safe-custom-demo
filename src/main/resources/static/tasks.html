<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Lead Queue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #f55215; --orange-dark: #d4430f; --orange-light: #ff9a3d;
      --dark: #0d0d0c; --charcoal: #2c2c2b; --gray: #6e6e6e; --gray-light: #949494;
      --cream: #f4f3ed; --white: #ffffff; --border: #e2e2df; --border-dark: #dad9d7;
      --success: #0a7b28; --success-bg: #e6f4ea;
      --info: #0663c9; --info-bg: #e5f2fc;
      --warning: #a15c00; --warning-bg: #fdf1de;
      --error: #c81010; --error-bg: #fce8e8;
      --font: "Staff", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body { background: var(--cream); color: var(--charcoal); font-family: var(--font); font-size: 14px; min-height: 100vh; }

    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 64px; background: var(--dark); position: sticky; top: 0; z-index: 50; }
    .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
    .brand-mark { font-weight: 800; font-size: 20px; letter-spacing: .5px; color: var(--orange); }
    .brand-sub { font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #c8c7c2; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { color: #c8c7c2; text-decoration: none; font-size: 13px; font-weight: 500;
      padding: 8px 16px; border-radius: 999px; transition: all .15s; }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,.08); }
    .nav-link.active { color: #fff; background: var(--orange); }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 999px;
      font-size: 13px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; transition: all .15s; }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:hover { background: var(--orange-dark); }
    .btn-primary:disabled { background: var(--border-dark); color: var(--gray-light); cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--dark); border: 1.5px solid var(--border-dark); }
    .btn-ghost:hover { background: var(--white); border-color: var(--dark); }
    .btn-sm { padding: 6px 14px; font-size: 12px; }

    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-header-left { display: flex; align-items: center; gap: 12px; }
    .page-header h1 { font-size: 24px; font-weight: 700; }
    .task-count-badge { background: var(--orange); color: #fff; font-size: 12px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px; }
    .task-count-badge.zero { background: var(--border); color: var(--gray); }

    .task-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 22px; margin-bottom: 10px; display: flex; align-items: center;
      justify-content: space-between; cursor: pointer; gap: 16px; transition: all .15s; }
    .task-card:hover { border-color: var(--orange); box-shadow: 0 4px 14px rgba(0,0,0,.05); }
    .task-card-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
    .task-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--cream);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: var(--orange); flex-shrink: 0; }
    .task-name { font-weight: 700; font-size: 14px; }
    .task-meta-line { font-size: 12px; color: var(--gray); margin-top: 3px; }
    .task-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

    .badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .3px;
      padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .badge-exceeds    { background: var(--success-bg); color: var(--success); }
    .badge-meets      { background: var(--info-bg);    color: var(--info); }
    .badge-developing { background: var(--warning-bg); color: var(--warning); }
    .badge-notmet     { background: var(--error-bg);   color: var(--error); }
    .badge-na         { background: var(--border);     color: var(--gray); }
    .badge-neutral    { background: var(--cream); color: var(--gray); border: 1px solid var(--border); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
    .empty-state .icon { font-size: 36px; margin-bottom: 14px; color: var(--orange-light); }
    .empty-state h3 { font-size: 16px; font-weight: 700; color: var(--charcoal); margin-bottom: 8px; }
    .empty-state p { font-size: 13px; line-height: 1.6; max-width: 420px; margin: 0 auto 18px; }
    .empty-state a { color: var(--orange); text-decoration: none; font-weight: 600; }

    .loading-msg { text-align: center; padding: 60px 20px; color: var(--gray); font-size: 13px; }
    .error-msg { background: var(--error-bg); border: 1px solid rgba(200,16,16,.25);
      border-radius: 10px; padding: 12px 16px; color: var(--error); font-size: 13px; margin-bottom: 12px; }

    .drawer-overlay { position: fixed; inset: 0; background: rgba(13,13,12,.45);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 199; }
    .drawer-overlay.show { opacity: 1; pointer-events: all; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw);
      background: var(--cream); border-left: 1px solid var(--border-dark);
      transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1);
      overflow: hidden; z-index: 200; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }

    .drawer-header { display: flex; align-items: flex-start; justify-content: space-between;
      padding: 20px 26px; background: var(--dark); flex-shrink: 0; gap: 12px; }
    .drawer-header-title { font-weight: 700; font-size: 16px; line-height: 1.3; color: #fff; }
    .drawer-header-sub { font-size: 12px; color: #c8c7c2; margin-top: 3px; }
    .drawer-close { background: none; border: none; color: #c8c7c2; font-size: 22px;
      cursor: pointer; padding: 0 4px; border-radius: 999px; line-height: 1; flex-shrink: 0; }
    .drawer-close:hover { color: #fff; background: rgba(255,255,255,.1); }
    .drawer-scroll { flex: 1; overflow-y: auto; }

    .drawer-section { padding: 20px 26px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
      color: var(--orange); margin-bottom: 14px; }

    .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
    .kv-label { font-size: 11px; color: var(--gray); margin-bottom: 2px; }
    .kv-value { font-size: 13px; font-weight: 600; }
    .thread-quote { margin-top: 14px; background: var(--white); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; font-size: 12px; line-height: 1.6; color: var(--charcoal);
      font-style: italic; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag { background: var(--white); border: 1px solid var(--border); border-radius: 999px;
      font-size: 10px; padding: 3px 10px; color: var(--gray); }

    .score-hero { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
    .score-pct { font-size: 36px; font-weight: 800; line-height: 1; }
    .score-pct.exceeds { color: var(--success); }
    .score-pct.meets { color: var(--info); }
    .score-pct.notmet { color: var(--error); }
    .score-meta { font-size: 12px; color: var(--gray); }

    .anomaly-banner { background: var(--warning-bg); border: 1px solid rgba(161,92,0,.25);
      border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 12px; color: var(--warning); }
    .anomaly-banner strong { display: block; margin-bottom: 4px; }

    .dimension { margin-bottom: 18px; }
    .dimension:last-child { margin-bottom: 0; }
    .dimension-title { font-size: 12px; font-weight: 700; color: var(--charcoal); margin-bottom: 8px; }
    .category { background: var(--white); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 8px; }
    .category:last-child { margin-bottom: 0; }
    .category-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 10px; }
    .category-name { font-size: 12px; font-weight: 600; }
    .category-evidence { font-size: 12px; color: var(--gray); line-height: 1.5; }
    .category-confidence { font-size: 10px; color: var(--gray-light); margin-top: 6px; }
    .category-rubric { font-size: 11px; color: var(--gray); line-height: 1.5; margin-top: 8px;
      padding-top: 8px; border-top: 1px dashed var(--border); }
    .category-rubric strong { color: var(--charcoal); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(13,13,12,.45);
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 249;
      display: flex; align-items: center; justify-content: center; padding: 24px; }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal-box { background: var(--cream); border-radius: 12px; width: min(720px, 100%);
      max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25);
      transform: scale(.97); transition: transform .2s; }
    .modal-overlay.show .modal-box { transform: scale(1); }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between;
      padding: 20px 26px; background: var(--dark); border-radius: 12px 12px 0 0; flex-shrink: 0; }
    .modal-header-title { font-weight: 700; font-size: 16px; color: #fff; }
    .modal-header-sub { font-size: 12px; color: #c8c7c2; margin-top: 3px; }
    .modal-close { background: none; border: none; color: #c8c7c2; font-size: 22px;
      cursor: pointer; padding: 0 4px; border-radius: 999px; line-height: 1; flex-shrink: 0; }
    .modal-close:hover { color: #fff; background: rgba(255,255,255,.1); }
    .modal-scroll { flex: 1; overflow-y: auto; padding: 20px 26px; }
    .rubric-dimension { margin-bottom: 20px; }
    .rubric-dimension:last-child { margin-bottom: 0; }
    .rubric-dimension-title { font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .4px; color: var(--orange); margin-bottom: 10px; }
    .rubric-row { background: var(--white); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 8px; }
    .rubric-row:last-child { margin-bottom: 0; }
    .rubric-row-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .rubric-row-name { font-size: 13px; font-weight: 700; }
    .rubric-row-weight { font-size: 10px; color: var(--gray); white-space: nowrap; }
    .rubric-row-desc { font-size: 12px; color: var(--charcoal); line-height: 1.5; }
    .rubric-scale { font-size: 11px; color: var(--gray); margin-bottom: 16px; }

    .form-section { background: var(--white); }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--charcoal); margin-bottom: 6px; }
    select, textarea, input {
      width: 100%; background: var(--cream); border: 1px solid var(--border-dark); border-radius: 8px;
      color: var(--charcoal); font-size: 13px; padding: 9px 12px; outline: none;
      font-family: var(--font); resize: vertical; }
    select:focus, textarea:focus, input:focus { border-color: var(--orange); background: var(--white); }
    .error-inline { background: var(--error-bg); border: 1px solid rgba(200,16,16,.25);
      border-radius: 6px; padding: 8px 12px; color: var(--error); font-size: 12px; margin-top: 10px; }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(12px);
      background: var(--dark); border: 1px solid var(--success); color: #7bdcb5;
      padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity .2s, transform .2s; z-index: 300; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .spinner-sm { display: inline-block; width: 10px; height: 10px; border: 1.5px solid rgba(0,0,0,.1);
      border-top-color: var(--gray); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="topbar">
  <a href="/index.html" class="brand">
    <span class="brand-mark">SAFE</span>
    <span class="brand-sub">Support QA</span>
  </a>
  <nav class="nav-links">
    <a href="/index.html" class="nav-link">Overview</a>
    <a href="/start.html" class="nav-link">Start Review</a>
    <a href="/tasks.html" class="nav-link active">TL Queue</a>
    <a href="/admin.html" class="nav-link">Dashboard</a>
  </nav>
</header>

<main>
  <div class="page-header">
    <div class="page-header-left">
      <h1>Team Lead Queue</h1>
      <span class="task-count-badge zero" id="taskCountBadge">&mdash;</span>
    </div>
    <div style="display:flex; gap:8px">
      <button class="btn btn-ghost" onclick="openRubricModal()">View Full Rubric</button>
      <button class="btn btn-ghost" onclick="loadTasks()">Refresh</button>
    </div>
  </div>

  <div id="taskList">
    <div class="loading-msg"><span class="spinner-sm"></span> Loading queue&hellip;</div>
  </div>
</main>

<div class="modal-overlay" id="rubricOverlay" onclick="closeRubricModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <div class="modal-header-title">Support QA Rubric</div>
        <div class="modal-header-sub">All 9 categories &mdash; the same criteria the AI agents score against</div>
      </div>
      <button class="modal-close" onclick="closeRubricModal()" title="Close">&#10005;</button>
    </div>
    <div class="modal-scroll" id="rubricModalBody">
      <div class="loading-msg">Loading&hellip;</div>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <div class="drawer-header-title" id="drawerTitle">Review</div>
      <div class="drawer-header-sub" id="drawerSub"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()" title="Close">&#10005;</button>
  </div>
  <div class="drawer-scroll" id="drawerBody">
    <div class="loading-msg">Loading&hellip;</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentTaskKey = null;

const CATEGORY_LABELS = {
  toneProfessionalism: 'Tone, Professionalism & Acknowledgment',
  nextStepsOwnership: 'Next Steps & Ownership',
  callChannelJudgment: 'Call / Channel Judgment',
  rootCauseIdentified: 'Root Cause Identified',
  technicalAccuracy: 'Technical Accuracy',
  completeness: 'Completeness (Workaround vs. Fix)',
  jiraBugTicket: 'Jira Bug Ticket',
  internalNotes: 'Internal Notes',
  followUpCommitments: 'Follow-Up Commitments'
};

const DIMENSIONS = [
  { title: 'Communication', categories: ['toneProfessionalism', 'nextStepsOwnership', 'callChannelJudgment'] },
  { title: 'Technical Advice', categories: ['rootCauseIdentified', 'technicalAccuracy', 'completeness'] },
  { title: 'Process Adherence', categories: ['jiraBugTicket', 'internalNotes', 'followUpCommitments'] }
];

// Populated once from GET /api/tasks/rubric — same category table the AI agents' get-rubric
// tool serves, keyed by category id so both the modal and the per-category inline hint can use it.
let RUBRIC_BY_CATEGORY = {};
let rubricLoadPromise = null;

function loadRubric() {
  if (!rubricLoadPromise) {
    rubricLoadPromise = fetch('/api/tasks/rubric').then(r => r.json()).then(data => {
      (data.categories || []).forEach(c => { RUBRIC_BY_CATEGORY[c.category] = c; });
      return data;
    });
  }
  return rubricLoadPromise;
}

async function openRubricModal() {
  document.getElementById('rubricOverlay').classList.add('show');
  const body = document.getElementById('rubricModalBody');
  try {
    const data = await loadRubric();
    body.innerHTML = `
      <div class="rubric-scale">Scale: ${escHtml(data.scale || '')}</div>
      ${DIMENSIONS.map(dim => `
        <div class="rubric-dimension">
          <div class="rubric-dimension-title">${escHtml(dim.title)}</div>
          ${dim.categories.map(catKey => {
            const c = RUBRIC_BY_CATEGORY[catKey] || {};
            return `
              <div class="rubric-row">
                <div class="rubric-row-head">
                  <div class="rubric-row-name">${escHtml(CATEGORY_LABELS[catKey] || catKey)}</div>
                  <div class="rubric-row-weight">Weight ${escHtml(c.weight ?? '—')}</div>
                </div>
                <div class="rubric-row-desc">${escHtml(c.meetsStandard || 'No description available.')}</div>
              </div>`;
          }).join('')}
        </div>`).join('')}`;
  } catch (err) {
    body.innerHTML = `<div class="error-msg">Could not load the rubric: ${escHtml(err.message)}</div>`;
  }
}

function closeRubricModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('rubricOverlay').classList.remove('show');
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relativeTime(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60)    return `${s}s ago`;
  if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function ratingBadge(rating) {
  if (!rating) return '<span class="badge badge-neutral">Not yet scored</span>';
  const cls = rating === 'Exceeds' ? 'badge-exceeds' : rating === 'Meets' ? 'badge-meets' : 'badge-notmet';
  const label = rating === 'NeedsImprovement' ? 'Needs Improvement' : rating;
  return `<span class="badge ${cls}">${escHtml(label)}</span>`;
}

function scoreBadge(score) {
  if (score === 'NotApplicable' || score === undefined || score === null) {
    return '<span class="badge badge-na">N/A</span>';
  }
  const n = Number(score);
  if (n >= 4) return '<span class="badge badge-exceeds">4 &middot; Excellent</span>';
  if (n === 3) return '<span class="badge badge-meets">3 &middot; Meets Standard</span>';
  if (n === 2) return '<span class="badge badge-developing">2 &middot; Developing</span>';
  return '<span class="badge badge-notmet">1 &middot; Does Not Meet</span>';
}

function yesNoBadge(value, yesLabel, noLabel) {
  return value
    ? `<span class="badge badge-exceeds">${escHtml(yesLabel)}</span>`
    : `<span class="badge badge-notmet">${escHtml(noLabel)}</span>`;
}

function renderTaskList(tasks) {
  const list = document.getElementById('taskList');

  if (tasks.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">&#10003;</div>
        <h3>Queue is empty</h3>
        <p>Tickets appear here once the selection engine routes them for Team Lead review &mdash;
           roughly 5&ndash;8% of scored tickets, plus any low score or AI-flagged anomaly.</p>
        <a href="/start.html">Start a review &rarr;</a>
      </div>`;
    return;
  }

  list.innerHTML = tasks.map(t => {
    const v = t.variables || {};
    const subject = v.ticketSubject || t.elementId || 'Review';
    const meta = [v.customerName, v.zendeskTicketId ? `ticket ${v.zendeskTicketId}` : null, relativeTime(t.creationDate)]
      .filter(Boolean).join(' · ');
    return `
      <div class="task-card" onclick="openTask('${t.userTaskKey}', '${t.processInstanceKey}')">
        <div class="task-card-left">
          <div class="task-icon">TL</div>
          <div>
            <div class="task-name">${escHtml(subject)}</div>
            <div class="task-meta-line">${escHtml(meta)}</div>
          </div>
        </div>
        <div class="task-right">
          ${ratingBadge(v.overallProvisionalRating)}
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openTask('${t.userTaskKey}', '${t.processInstanceKey}')">Open &rarr;</button>
        </div>
      </div>`;
  }).join('');
}

async function loadTasks() {
  const list = document.getElementById('taskList');
  const badge = document.getElementById('taskCountBadge');

  list.innerHTML = '<div class="loading-msg"><span class="spinner-sm"></span> Loading queue&hellip;</div>';
  badge.textContent = '—';
  badge.className = 'task-count-badge zero';

  try {
    const tasks = await fetch('/api/tasks').then(r => r.json());
    // The task API lists open tasks across every process on the cluster (shared trial
    // environment with other demos); scope this queue to our Team Lead review step only.
    const allTasks = (Array.isArray(tasks) ? tasks : []).filter(t => t.elementId === 'Task_TlReview');
    badge.textContent = allTasks.length;
    badge.className = allTasks.length > 0 ? 'task-count-badge' : 'task-count-badge zero';
    renderTaskList(allTasks);
  } catch (err) {
    badge.textContent = '!';
    list.innerHTML = `<div class="error-msg">Could not load the queue: ${escHtml(err.message)}</div>`;
  }
}

async function openTask(taskKey, piKey) {
  currentTaskKey = taskKey;
  document.getElementById('drawerTitle').textContent = 'Loading…';
  document.getElementById('drawerSub').textContent = '';
  document.getElementById('drawerBody').innerHTML = '<div class="loading-msg"><span class="spinner-sm"></span> Loading review context&hellip;</div>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');

  try {
    const [ctx] = await Promise.all([
      fetch(`/api/tasks/${taskKey}/context?piKey=${piKey}`).then(r => r.json()),
      loadRubric()
    ]);
    if (ctx.error) throw new Error(ctx.error);
    const v = ctx.variables || {};
    document.getElementById('drawerTitle').textContent = v.ticketSubject || 'Team Lead review';
    document.getElementById('drawerSub').textContent = v.zendeskTicketId ? `Ticket ${v.zendeskTicketId}` : '';
    document.getElementById('drawerBody').innerHTML = renderDrawer(v);
  } catch (err) {
    document.getElementById('drawerBody').innerHTML = `<div class="drawer-section"><div class="error-msg">${escHtml(err.message)}</div></div>`;
  }
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  currentTaskKey = null;
}

function renderDrawer(v) {
  return renderTicketSection(v)
    + renderChecksSection(v)
    + renderAssessmentSection(v)
    + renderSelectionSection(v)
    + renderDecisionForm();
}

function renderTicketSection(v) {
  const tags = Array.isArray(v.tags) ? v.tags : [];
  return `
    <div class="drawer-section">
      <div class="section-title">Ticket Snapshot</div>
      <div class="kv-grid">
        <div class="kv"><div class="kv-label">Customer</div><div class="kv-value">${escHtml(v.customerName)}</div></div>
        <div class="kv"><div class="kv-label">Agent</div><div class="kv-value">${escHtml(v.agentName)}</div></div>
        <div class="kv"><div class="kv-label">Channel</div><div class="kv-value">${escHtml(v.channel)}${v.hasCall ? ' + call' : ''}</div></div>
        <div class="kv"><div class="kv-label">Reply count</div><div class="kv-value">${escHtml(v.replyCount)}</div></div>
      </div>
      ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
      ${v.threadExcerpt ? `<div class="thread-quote">${escHtml(v.threadExcerpt)}</div>` : ''}
    </div>`;
}

function renderChecksSection(v) {
  return `
    <div class="drawer-section">
      <div class="section-title">Deterministic Checks</div>
      <div class="kv-grid">
        <div class="kv"><div class="kv-label">First response</div>
          <div class="kv-value">${escHtml(v.firstResponseMinutes)} min ${yesNoBadge(v.slaMet, 'SLA met', 'SLA breached')}</div></div>
        <div class="kv"><div class="kv-label">Jira</div>
          <div class="kv-value">${v.jiraLinked ? `<span class="badge badge-exceeds">Linked ${escHtml(v.jiraIssueKey)}</span>` : '<span class="badge badge-na">Not linked</span>'}</div></div>
        <div class="kv"><div class="kv-label">Response cadence</div>
          <div class="kv-value">${yesNoBadge(!v.responseCadenceFlag, 'Normal', 'Flagged')}</div></div>
        <div class="kv"><div class="kv-label">Internal notes</div>
          <div class="kv-value">${yesNoBadge(v.internalNotesPresent, 'Present', 'Missing')}</div></div>
        <div class="kv"><div class="kv-label">Follow-up commitment</div>
          <div class="kv-value">${v.followUpCommitmentMade ? yesNoBadge(v.followUpHonoredOnTime, 'Honored on time', 'Not honored') : '<span class="badge badge-na">None made</span>'}</div></div>
      </div>
    </div>`;
}

function renderAssessmentSection(v) {
  const pct = v.overallScorePercent;
  const rating = v.overallProvisionalRating;
  const pctClass = rating === 'Exceeds' ? 'exceeds' : rating === 'Meets' ? 'meets' : 'notmet';
  const categoryScores = v.categoryScores || {};
  const anomalyReasons = Array.isArray(v.anomalyReasons) ? v.anomalyReasons : [];

  const scoreHero = pct !== undefined ? `
    <div class="score-hero">
      <div class="score-pct ${pctClass}">${escHtml(pct)}%</div>
      <div class="score-meta">${ratingBadge(rating)}<br>Lowest category score: ${escHtml(v.lowestCategoryScore ?? '—')}</div>
    </div>` : `<div class="score-meta" style="margin-bottom:16px">Scoring still in progress &mdash; refresh in a moment.</div>`;

  const anomalyBanner = v.anomalyFlagged ? `
    <div class="anomaly-banner">
      <strong>&#9888; AI flagged this ticket as atypical</strong>
      ${anomalyReasons.length ? anomalyReasons.map(r => escHtml(r)).join('; ') : 'No reasons provided.'}
    </div>` : '';

  const dimensions = DIMENSIONS.map(dim => `
    <div class="dimension">
      <div class="dimension-title">${escHtml(dim.title)}</div>
      ${dim.categories.map(catKey => {
        const cat = categoryScores[catKey] || {};
        const rubric = RUBRIC_BY_CATEGORY[catKey];
        return `
          <div class="category">
            <div class="category-head">
              <div class="category-name">${escHtml(CATEGORY_LABELS[catKey] || catKey)}</div>
              ${scoreBadge(cat.score)}
            </div>
            ${cat.evidence ? `<div class="category-evidence">${escHtml(cat.evidence)}</div>` : ''}
            ${cat.confidence !== undefined ? `<div class="category-confidence">Confidence: ${Math.round(cat.confidence * 100)}%</div>` : ''}
            ${rubric ? `<div class="category-rubric"><strong>Meets Standard:</strong> ${escHtml(rubric.meetsStandard)}</div>` : ''}
          </div>`;
      }).join('')}
    </div>`).join('');

  return `
    <div class="drawer-section">
      <div class="section-title">AI Assessment (provisional)</div>
      ${scoreHero}
      ${anomalyBanner}
      ${dimensions}
    </div>`;
}

function renderSelectionSection(v) {
  return `
    <div class="drawer-section">
      <div class="section-title">Why This Ticket Is Here</div>
      <div class="kv-grid">
        <div class="kv"><div class="kv-label">Selection channel</div><div class="kv-value">${escHtml(v.selectionChannel || '—')}</div></div>
        <div class="kv"><div class="kv-label">Trigger reason</div><div class="kv-value">${escHtml(v.triggerReason || '—')}</div></div>
      </div>
      ${v.selectionReason ? `<div class="thread-quote" style="margin-top:12px">${escHtml(v.selectionReason)}</div>` : ''}
    </div>`;
}

function renderDecisionForm() {
  return `
    <div class="drawer-section form-section">
      <div class="section-title">Team Lead Decision</div>
      <div class="field">
        <label for="finalRating">Final rating</label>
        <select id="finalRating">
          <option value="Exceeds">Exceeds</option>
          <option value="Meets" selected>Meets</option>
          <option value="NeedsImprovement">Needs Improvement</option>
        </select>
      </div>
      <div class="field">
        <label for="coachingNotes">Coaching notes</label>
        <textarea id="coachingNotes" rows="4" placeholder="What should the agent keep doing, and what should change?"></textarea>
      </div>
      <div class="field">
        <label for="reviewedBy">Reviewed by</label>
        <input id="reviewedBy" type="text" placeholder="Your name">
      </div>
      <div id="submitError" class="error-inline" style="display:none"></div>
      <button class="btn btn-primary" id="submitBtn" onclick="submitTask()" style="width:100%; justify-content:center; margin-top:6px">Submit review</button>
    </div>`;
}

async function submitTask() {
  const btn = document.getElementById('submitBtn');
  const finalRating = document.getElementById('finalRating').value;
  const coachingNotes = document.getElementById('coachingNotes').value;
  const reviewedBy = document.getElementById('reviewedBy').value.trim();

  if (!reviewedBy) {
    showInlineError('Enter your name in "Reviewed by" before submitting.');
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  try {
    const res = await fetch(`/api/tasks/${currentTaskKey}/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ variables: { finalRating, coachingNotes, reviewedBy } })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    closeDrawer();
    showToast('Review submitted — thank you!');
    loadTasks();
  } catch (err) {
    showInlineError('Error: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Submit review'; }
  }
}

function showInlineError(msg) {
  const el = document.getElementById('submitError');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

loadTasks();
loadRubric();
setInterval(loadTasks, 30000);
</script>
</body>
</html>
