<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Inbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
      --border: #2a2a2a; --accent: #0078f2; --accent-hover: #0062cc;
      --success: #22c55e; --error: #ef4444;
      --text: #e5e5e5; --muted: #888; --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

    .nav { display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 56px; background: #111; border-bottom: 1px solid var(--border); }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: #fff; text-decoration: none; }
    .brand-mark { background: var(--accent); color: #fff; width: 26px; height: 26px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.active { color: #fff; }

    main { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-header-left { display: flex; align-items: center; gap: 12px; }
    .page-header h1 { font-size: 24px; font-weight: 700; }
    .task-count-badge { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
      padding: 2px 9px; border-radius: 10px; }
    .task-count-badge.zero { background: var(--surface2); color: var(--muted); }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 7px;
      font-size: 13px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #2a2a2a; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-full { width: 100%; justify-content: center; padding: 10px 16px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px 20px; margin-bottom: 10px; display: flex; align-items: center;
      justify-content: space-between; cursor: pointer; gap: 16px; }
    .task-card:hover { border-color: var(--accent); background: #1d1d1d; }
    .task-card-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
    .task-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--surface2);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; }
    .task-name { font-weight: 600; font-size: 14px; }
    .task-meta-line { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .category-pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .3px;
      padding: 2px 7px; border-radius: 5px; margin-right: 6px; }
    .cat-Minimal  { background: rgba(34,197,94,.15);  color: #4ade80; }
    .cat-Limited  { background: rgba(59,130,246,.15); color: #60a5fa; }
    .cat-High     { background: rgba(245,158,11,.15); color: #fbbf24; }
    .cat-Critical { background: rgba(239,68,68,.15);  color: #f87171; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 13px; line-height: 1.6; max-width: 420px; margin: 0 auto 18px; }
    .empty-state a { color: var(--accent); text-decoration: none; }

    .loading-msg { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }
    .error-msg { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px; padding: 12px 16px; color: var(--error); font-size: 13px; margin-bottom: 12px; }

    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 199; }
    .drawer-overlay.show { opacity: 1; pointer-events: all; }
    .drawer { position: fixed; top: 56px; right: 0; bottom: 0; width: min(540px, 100vw);
      background: var(--surface); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1);
      overflow: hidden; z-index: 200; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }

    .drawer-header { display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 12px; }
    .drawer-header-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
    .drawer-close { background: none; border: none; color: var(--muted); font-size: 22px;
      cursor: pointer; padding: 0 4px; border-radius: 5px; line-height: 1; flex-shrink: 0; }
    .drawer-close:hover { color: var(--text); background: var(--surface2); }
    .drawer-scroll { flex: 1; overflow-y: auto; }

    .drawer-app-bar { padding: 14px 24px; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .drawer-app-name { font-weight: 700; font-size: 16px; }
    .drawer-app-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .drawer-section { padding: 18px 24px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px; }

    .kv-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; align-items: center; }
    .kv-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .kv-value { font-size: 13px; font-weight: 500; }

    pre.vars { background: #111; border: 1px solid var(--border); border-radius: 7px; padding: 14px;
      font-family: ui-monospace, monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }

    .triage-section { background: #14181f; }
    .pill-advisory { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .3px;
      text-transform: none; background: rgba(0,120,242,.15); color: #60a5fa; padding: 2px 8px;
      border-radius: 5px; margin-left: 8px; }
    .triage-summary { font-family: var(--font); white-space: pre-wrap; margin-bottom: 12px; }
    .tool-calls-label { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px; }
    .tool-call { background: #111; border: 1px solid var(--border); border-radius: 7px;
      padding: 10px 12px; margin-bottom: 8px; }
    .tool-call:last-child { margin-bottom: 0; }
    .tool-call-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .tool-call-content { font-size: 12px; color: var(--muted); white-space: pre-wrap; line-height: 1.5; }

    .form-section { background: #161616; }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .select-input, .text-input, .textarea-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 13px; padding: 8px 12px; outline: none;
      font-family: inherit; }
    .select-input:focus, .text-input:focus, .textarea-input:focus { border-color: var(--accent); }
    .select-input option { background: #1a1a1a; }
    .textarea-input { resize: vertical; }
    .checkbox-field { display: flex; align-items: center; gap: 8px; }
    .checkbox-field input { width: auto; }
    .error-inline { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 6px; padding: 8px 12px; color: var(--error); font-size: 12px; margin-bottom: 12px; }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(12px);
      background: #1a1a1a; border: 1px solid var(--success); color: var(--success);
      padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity .2s, transform .2s; z-index: 300; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .spinner-sm { display: inline-block; width: 10px; height: 10px; border: 1.5px solid rgba(255,255,255,.15);
      border-top-color: var(--muted); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/index.html" class="nav-brand">
    <span class="brand-mark">G</span>
    AI Governance
  </a>
  <div class="nav-links">
    <a href="/start.html" class="nav-link">Register</a>
    <a href="/tasks.html" class="nav-link active">Tasks</a>
    <a href="/admin.html" class="nav-link">Dashboard</a>
  </div>
</nav>

<main>
  <div class="page-header">
    <div class="page-header-left">
      <h1>Task Inbox</h1>
      <span class="task-count-badge zero" id="taskCountBadge">—</span>
    </div>
    <button class="btn btn-ghost" onclick="loadTasks()">Refresh</button>
  </div>

  <div id="taskList">
    <div class="loading-msg"><span class="spinner-sm"></span> Loading tasks…</div>
  </div>
</main>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-header-title" id="drawerTitle">Task Detail</div>
    <button class="drawer-close" onclick="closeDrawer()" title="Close">✕</button>
  </div>
  <div class="drawer-scroll" id="drawerBody">
    <div class="loading-msg">Loading…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TASK_LABELS = {
  Task_AssignOwners:          'Assign accountable owners',
  Task_SecurityReview:        'Review security posture',
  Task_PrivacyReview:         'Review privacy impact',
  Task_LegalReview:           'Review legal implications',
  Task_ComplianceReview:      'Review regulatory compliance',
  Task_ArchitectureReview:    'Review technical architecture',
  Task_RaiReview:             'Review responsible AI alignment',
  Task_ModelEvaluationGate:   'Complete model evaluation',
  Task_DesignConsultationGate:'Confirm design consultation',
  Task_PreBuildGate:          'Complete pre-build checkpoint',
  Task_PreProductionGate:     'Complete pre-production checkpoint',
  Task_LaunchApproval:        'Accept launch approval & residual risk',
  Task_MonitorInProduction:   'Monitor system in production',
  Task_RecertificationReview: 'Complete recertification review',
  Task_ReassessmentReview:    'Complete reassessment review',
  Task_Decommission:          'Decommission system & revoke access'
};
const REVIEW_TASKS = new Set([
  'Task_SecurityReview', 'Task_PrivacyReview', 'Task_LegalReview',
  'Task_ComplianceReview', 'Task_ArchitectureReview', 'Task_RaiReview'
]);
const GATE_TASKS = new Set([
  'Task_ModelEvaluationGate', 'Task_DesignConsultationGate',
  'Task_PreBuildGate', 'Task_PreProductionGate'
]);

let allTasks = [];
let currentTaskKey  = null;
let currentTaskType = null;

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relativeTime(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60)    return `${s}s ago`;
  if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function renderTaskList(tasks) {
  const list = document.getElementById('taskList');

  if (tasks.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">✅</div>
        <h3>No open tasks</h3>
        <p>Tasks appear here once a registered use case reaches a review, gate, or monitoring step.</p>
        <a href="/start.html">Register a use case →</a>
      </div>`;
    return;
  }

  list.innerHTML = tasks.map(t => {
    const vars = t.variables || {};
    const label = TASK_LABELS[t.elementId] || t.elementId || 'Task';
    const age = relativeTime(t.creationDate);
    const category = vars.aiCategory ? `<span class="category-pill cat-${escHtml(vars.aiCategory)}">${escHtml(vars.aiCategory)}</span>` : '';
    return `
      <div class="task-card" onclick="openTask('${t.userTaskKey}', '${t.processInstanceKey}', '${t.elementId}')">
        <div class="task-card-left">
          <div class="task-icon">📋</div>
          <div>
            <div class="task-name">${escHtml(label)}</div>
            <div class="task-meta-line">${category}${escHtml(vars.useCaseName || 'Use case pi ' + t.processInstanceKey)} · ${age}</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openTask('${t.userTaskKey}', '${t.processInstanceKey}', '${t.elementId}')">Open →</button>
      </div>`;
  }).join('');
}

async function loadTasks() {
  const list = document.getElementById('taskList');
  const badge = document.getElementById('taskCountBadge');

  list.innerHTML = '<div class="loading-msg"><span class="spinner-sm"></span> Loading tasks…</div>';
  badge.textContent = '—';
  badge.className = 'task-count-badge zero';

  try {
    const tasks = await fetch('/api/tasks').then(r => r.json());
    allTasks = Array.isArray(tasks) ? tasks : [];
    badge.textContent = allTasks.length;
    badge.className = allTasks.length > 0 ? 'task-count-badge' : 'task-count-badge zero';
    renderTaskList(allTasks);
  } catch (err) {
    badge.textContent = '!';
    list.innerHTML = `<div class="error-msg">Could not load tasks: ${escHtml(err.message)}</div>`;
  }
}

async function openTask(taskKey, piKey, elementId) {
  currentTaskKey  = taskKey;
  currentTaskType = elementId;
  document.getElementById('drawerTitle').textContent = TASK_LABELS[elementId] || elementId;
  document.getElementById('drawerBody').innerHTML = '<div class="loading-msg"><span class="spinner-sm"></span> Loading task details…</div>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');

  try {
    const ctx = await fetch(`/api/tasks/${taskKey}/context?piKey=${piKey}`).then(r => r.json());
    if (ctx.error) throw new Error(ctx.error);
    document.getElementById('drawerBody').innerHTML = renderDrawer(elementId, ctx.variables || {});
  } catch (err) {
    document.getElementById('drawerBody').innerHTML = `<div class="drawer-section"><div class="error-msg">${escHtml(err.message)}</div></div>`;
  }
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  currentTaskKey  = null;
  currentTaskType = null;
}

// ─── Shared context header + decision panel ──────────────────────────────────

const TOOL_LABELS = {
  Tool_SearchPolicyDocs: '📄 Searched policy documents',
  Tool_ScanSensitiveData: '🔍 Scanned for sensitive data',
  Tool_FindSimilarUseCases: '📚 Found similar use cases'
};

function renderTriageSection(vars) {
  if (!vars.triageSummary && !(Array.isArray(vars.triageToolCalls) && vars.triageToolCalls.length)) return '';

  const toolCalls = Array.isArray(vars.triageToolCalls) ? vars.triageToolCalls : [];
  const toolCallsHtml = toolCalls.map(tc => `
    <div class="tool-call">
      <div class="tool-call-name">${escHtml(TOOL_LABELS[tc.name] || tc.name)}</div>
      <div class="tool-call-content">${escHtml(tc.content)}</div>
    </div>`).join('');

  return `
    <div class="drawer-section triage-section">
      <div class="section-title">🤖 AI Risk Triage Agent <span class="pill-advisory">Advisory — not a decision</span></div>
      ${vars.triageSummary ? `<pre class="vars triage-summary">${escHtml(vars.triageSummary)}</pre>` : ''}
      ${toolCallsHtml ? `<div class="tool-calls-label">Tool calls (${toolCalls.length})</div>${toolCallsHtml}` : ''}
    </div>`;
}

function contextHeader(vars) {
  return `
    <div class="drawer-app-bar">
      <div class="drawer-app-name">${escHtml(vars.useCaseName || '—')}</div>
      <div class="drawer-app-meta">${escHtml(vars.aiCategory ? vars.aiCategory + ' category' : '')} · submitted by ${escHtml(vars.submittedBy || '—')}</div>
    </div>
    <div class="drawer-section">
      <div class="section-title">Use Case</div>
      <div class="kv-grid">
        <div class="kv-label">Description</div><div class="kv-value">${escHtml(vars.description || '—')}</div>
        <div class="kv-label">Data sensitivity</div><div class="kv-value">${escHtml(vars.dataSensitivity || '—')}</div>
        <div class="kv-label">Autonomy level</div><div class="kv-value">${escHtml(vars.autonomyLevel || '—')}</div>
        <div class="kv-label">Business owner</div><div class="kv-value">${escHtml(vars.businessOwner || '—')}</div>
        <div class="kv-label">Technology owner</div><div class="kv-value">${escHtml(vars.technologyOwner || '—')}</div>
      </div>
    </div>
    ${renderTriageSection(vars)}`;
}

function decisionPanel(bodyHtml) {
  return `
    <div class="drawer-section form-section">
      <div class="section-title">Decision</div>
      ${bodyHtml}
      <div id="submitError" class="error-inline" style="display:none"></div>
      <button class="btn btn-primary btn-full" id="submitBtn" onclick="submitTask()" style="margin-top:14px">Submit</button>
    </div>`;
}

// ─── Per-task-type drawers ────────────────────────────────────────────────────

function renderDrawer(elementId, vars) {
  if (elementId === 'Task_AssignOwners') return renderAssignOwners(vars);
  if (REVIEW_TASKS.has(elementId)) return renderReview(vars);
  if (GATE_TASKS.has(elementId)) return renderGate(vars);
  if (elementId === 'Task_LaunchApproval') return renderLaunchApproval(vars);
  if (elementId === 'Task_MonitorInProduction') return renderMonitor(vars);
  if (elementId === 'Task_RecertificationReview') return renderRecertification(vars);
  if (elementId === 'Task_ReassessmentReview') return renderReassessment(vars);
  if (elementId === 'Task_Decommission') return renderDecommission(vars);
  return `<div class="drawer-section"><div class="error-msg">Unknown task type: ${escHtml(elementId)}</div></div>`;
}

function renderAssignOwners(vars) {
  return contextHeader(vars) + decisionPanel(`
    <div class="field">
      <label>Business owner (email)</label>
      <input type="text" id="in_businessOwner" class="text-input" placeholder="owner@company.com">
    </div>
    <div class="field">
      <label>Technology owner (email)</label>
      <input type="text" id="in_technologyOwner" class="text-input" placeholder="tech-owner@company.com">
    </div>`);
}

function renderReview(vars) {
  return contextHeader(vars) + decisionPanel(`
    <div class="field">
      <label>Decision</label>
      <select id="in_reviewDecision" class="select-input">
        <option value="">Select…</option>
        <option value="approve">Approve</option>
        <option value="reject">Reject</option>
      </select>
    </div>
    <div class="field">
      <label>Comments</label>
      <textarea id="in_reviewComments" class="textarea-input" rows="3"></textarea>
    </div>`);
}

function renderGate(vars) {
  return contextHeader(vars) + decisionPanel(`
    <div class="field">
      <label>Result</label>
      <select id="in_gateResult" class="select-input">
        <option value="">Select…</option>
        <option value="pass">Pass</option>
        <option value="fail">Fail</option>
      </select>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="in_gateNotes" class="textarea-input" rows="3"></textarea>
    </div>`);
}

function renderLaunchApproval(vars) {
  return contextHeader(vars) + decisionPanel(`
    <div class="field">
      <label>Approver (email)</label>
      <input type="text" id="in_launchApprover" class="text-input" placeholder="approver@company.com">
    </div>
    <div class="field checkbox-field">
      <input type="checkbox" id="in_residualRiskAccepted">
      <label style="margin:0">I accept the residual risk of launching this use case</label>
    </div>
    <div class="field">
      <label>Risk acceptance notes</label>
      <textarea id="in_riskAcceptanceNotes" class="textarea-input" rows="3"></textarea>
    </div>`);
}

function renderMonitor(vars) {
  return contextHeader(vars) + `
    <div class="drawer-section form-section">
      <div class="section-title">Voluntary Decommission</div>
      <p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px">
        This use case is live in production. Recertification runs automatically on the configured
        cycle, and an incident can be reported at any time from the Dashboard to trigger a
        reassessment. Completing this task directly begins a voluntary decommission.
      </p>
      <button class="btn btn-primary btn-full" onclick="submitTask()">Begin decommission</button>
    </div>`;
}

function renderRecertification(vars) {
  return contextHeader(vars) + decisionPanel(`
    <div class="field">
      <label>Decision</label>
      <select id="in_recertificationDecision" class="select-input">
        <option value="">Select…</option>
        <option value="approve">Approve — continue in production</option>
        <option value="reject">Reject — decommission</option>
      </select>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="in_recertificationNotes" class="textarea-input" rows="3"></textarea>
    </div>`);
}

function renderReassessment(vars) {
  return contextHeader(vars) + decisionPanel(`
    <div class="field">
      <label>Outcome</label>
      <select id="in_reassessmentOutcome" class="select-input">
        <option value="">Select…</option>
        <option value="no_material_impact">No material impact — resume monitoring</option>
        <option value="requires_full_rereview">Requires full re-review</option>
        <option value="recommend_decommission">Recommend decommission</option>
      </select>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="in_reassessmentNotes" class="textarea-input" rows="3"></textarea>
    </div>`);
}

function renderDecommission(vars) {
  return contextHeader(vars) + decisionPanel(`
    <div class="field">
      <label>Reason</label>
      <textarea id="in_decommissionReason" class="textarea-input" rows="3"></textarea>
    </div>
    <div class="field">
      <label>Decommissioned by (email)</label>
      <input type="text" id="in_decommissionedBy" class="text-input" placeholder="you@company.com">
    </div>
    <div class="field checkbox-field">
      <input type="checkbox" id="in_accessRevoked">
      <label style="margin:0">Access has been revoked for all users/devices</label>
    </div>`);
}

// ─── Build the completion payload per task type ───────────────────────────────

function collectVariables() {
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : undefined; };
  const checked = id => { const el = document.getElementById(id); return el ? el.checked : undefined; };

  switch (currentTaskType) {
    case 'Task_AssignOwners':
      return { businessOwner: val('in_businessOwner'), technologyOwner: val('in_technologyOwner') };
    case 'Task_SecurityReview': case 'Task_PrivacyReview': case 'Task_LegalReview':
    case 'Task_ComplianceReview': case 'Task_ArchitectureReview': case 'Task_RaiReview':
      return { reviewDecision: val('in_reviewDecision'), reviewComments: val('in_reviewComments') };
    case 'Task_ModelEvaluationGate': case 'Task_DesignConsultationGate':
    case 'Task_PreBuildGate': case 'Task_PreProductionGate':
      return { gateResult: val('in_gateResult'), gateNotes: val('in_gateNotes') };
    case 'Task_LaunchApproval':
      return {
        launchApprover: val('in_launchApprover'),
        residualRiskAccepted: checked('in_residualRiskAccepted'),
        riskAcceptanceNotes: val('in_riskAcceptanceNotes')
      };
    case 'Task_MonitorInProduction':
      return {};
    case 'Task_RecertificationReview':
      return { recertificationDecision: val('in_recertificationDecision'), recertificationNotes: val('in_recertificationNotes') };
    case 'Task_ReassessmentReview':
      return { reassessmentOutcome: val('in_reassessmentOutcome'), reassessmentNotes: val('in_reassessmentNotes') };
    case 'Task_Decommission':
      return {
        decommissionReason: val('in_decommissionReason'),
        decommissionedBy: val('in_decommissionedBy'),
        accessRevoked: checked('in_accessRevoked')
      };
    default:
      return {};
  }
}

async function submitTask() {
  const btn = document.getElementById('submitBtn');
  const variables = collectVariables();

  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  try {
    const res = await fetch(`/api/tasks/${currentTaskKey}/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ variables })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    closeDrawer();
    showToast('Task completed successfully!');
    loadTasks();
  } catch (err) {
    showInlineError('Error: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
  }
}

function showInlineError(msg) {
  const el = document.getElementById('submitError');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

loadTasks();
setInterval(loadTasks, 30000);
</script>
